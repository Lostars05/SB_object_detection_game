
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>GAME CAM - 미탐지</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* 전체 화면 */
        .container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            gap: 12px;

            padding:
                max(12px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));
        }

        /* 현재 점수 */
        #game-score {
            text-align: center;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: bold;
            padding: 8px 0;
            flex-shrink: 0;
        }

        /* 촬영된 사진 영역 */
        .photo-area {
            flex: 1;
            min-height: 0;
            min-width: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #photo-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 4 / 3;
            background: #111;
            border-radius: 14px;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #captured-photo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        #photo-message {
            color: #aaa;
            text-align: center;
            font-size: 14px;
            padding: 20px;
        }

        /* 하단 영역 */
        .bottom-area {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: stretch;
            gap: 12px;
            flex-shrink: 0;
        }

        /* 미탐지 결과 박스 */
        #detection-panel {
            flex: 1;
            min-width: 0;
            min-height: 90px;
            padding: 14px;

            background: #181818;
            border: 1px solid #444;
            border-radius: 12px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #detection-panel h4 {
            font-size: clamp(12px, 3vw, 15px);
            margin-bottom: 10px;
        }

        #detection-list {
            font-size: clamp(14px, 3.5vw, 18px);
            font-weight: bold;
            color: #fff;
        }

        /* 버튼 영역 */
        .button-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            width: clamp(88px, 26vw, 120px);
            flex-shrink: 0;
        }

        .action-btn {
            width: 100%;
            min-height: 44px;
            padding: 10px 8px;

            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;

            font-size: clamp(12px, 3.2vw, 16px);
            font-weight: bold;
            cursor: pointer;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        /* 상태 메시지 */
        #status {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            flex-shrink: 0;
        }

        /* 가로 화면 대응 */
        @media (orientation: landscape) {
            .container {
                gap: 6px;
            }

            #game-score {
                padding: 0;
            }

            #detection-panel {
                min-height: 65px;
                padding: 10px;
            }

            .button-group {
                gap: 6px;
            }

            .action-btn {
                min-height: 32px;
                padding: 6px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 1. 현재 점수 -->
        <h3 id="game-score">
            현재 점수: 0.00점
        </h3>

        <!-- 2. 촬영 당시 사진 -->
        <div class="photo-area" id="photo-area">

            <div id="photo-container">

                <img
                    id="captured-photo"
                    alt="객체가 탐지되지 않은 촬영 사진"
                >

                <p id="photo-message">
                    촬영 결과를 불러오는 중...
                </p>

            </div>

        </div>

        <!-- 3. None 표시 및 버튼 -->
        <div class="bottom-area">

            <div id="detection-panel">

                <h4>촬영 결과</h4>

                <div id="detection-list">
                    None
                </div>

            </div>

            <div class="button-group">

                <button
                    id="btn-retry"
                    class="action-btn"
                    type="button">
                    재시도
                </button>

                <button
                    id="btn-pass"
                    class="action-btn"
                    type="button">
                    PASS
                </button>

            </div>

        </div>

        <p id="status">
            탐지된 객체가 없습니다.
        </p>

    </div>

    <script src="authority.js" defer></script>

    <script>
        // ==========================================
        // 1. 기본 설정
        // ==========================================

        // 재시도 시 돌아갈 카메라 페이지
        const RETRY_PAGE = "cam1.html";

        // 추후 임원진 승인 페이지 연결 예정
        // 현재 PASS 버튼은 이동하지 않음

        const photo =
            document.getElementById("captured-photo");

        const photoMessage =
            document.getElementById("photo-message");

        const photoArea =
            document.getElementById("photo-area");

        const photoContainer =
            document.getElementById("photo-container");

        const statusText =
            document.getElementById("status");

        const retryBtn =
            document.getElementById("btn-retry");

        const passBtn =
            document.getElementById("btn-pass");

        // ==========================================
        // 2. 페이지 실행
        // ==========================================

        window.addEventListener(
            "DOMContentLoaded",
            () => {
                // 뒤로가기 차단 및 현 화면 유지 보안 코드
                history.pushState(null, null, location.href);
                window.addEventListener('popstate', () => {
                    history.pushState(null, null, location.href);
                    alert("이전 페이지로 돌아갈 수 없습니다. 재시도 또는 PASS를 이용해주세요.");
        });

        loadCaptureData();
    }
);

        // ==========================================
        // 3. 촬영 당시 사진 불러오기
        // ==========================================

        function loadCaptureData() {

            // cam1.html에서 전달한 촬영 데이터
            const saved =
                sessionStorage.getItem("cam1Pending");

            if (!saved) {
                photoMessage.textContent =
                    "촬영된 사진이 없습니다.";

                statusText.textContent =
                    "카메라에서 먼저 촬영해주세요.";

                return;
            }

            try {
                const captureData = JSON.parse(saved);

                if (
                    !captureData ||
                    !captureData.image ||
                    !Array.isArray(captureData.detections)
                ) {
                    throw new Error("촬영 데이터 형식 오류");
                }

                // 잘못 연결된 촬영 결과 방지
                if (captureData.detections.length > 0) {
                    statusText.textContent =
                        "탐지된 객체가 있는 촬영 결과입니다.";

                    location.replace("cam1_check.html");
                    return;
                }

                photo.onload = () => {
                    photo.style.display = "block";
                    photoMessage.style.display = "none";

                    resizePhoto();
                };

                photo.onerror = () => {
                    photoMessage.textContent =
                        "사진을 표시할 수 없습니다.";

                    statusText.textContent =
                        "사진 불러오기 오류";
                };

                photo.src = captureData.image;

                statusText.textContent =
                    "탐지된 객체가 없습니다.";

            } catch (error) {
                console.error(
                    "촬영 데이터 오류:",
                    error
                );

                photoMessage.textContent =
                    "촬영 데이터를 불러올 수 없습니다.";

                statusText.textContent =
                    "촬영 데이터 오류";
            }
        }

        // ==========================================
        // 4. 모바일 화면 비율 자동 조절
        // ==========================================

        function resizePhoto() {

            if (
                !photo.naturalWidth ||
                !photo.naturalHeight
            ) {
                return;
            }

            const ratio =
                photo.naturalWidth / photo.naturalHeight;

            const areaWidth =
                photoArea.clientWidth;

            const areaHeight =
                photoArea.clientHeight;

            if (!areaWidth || !areaHeight) {
                return;
            }

            const width = Math.min(
                areaWidth,
                areaHeight * ratio,
                900
            );

            const height = width / ratio;

            photoContainer.style.width =
                width + "px";

            photoContainer.style.height =
                height + "px";
        }

        new ResizeObserver(resizePhoto)
            .observe(photoArea);

        window.addEventListener(
            "resize",
            resizePhoto
        );

        // ==========================================
        // 5. 재시도 버튼
        // ==========================================

        retryBtn.addEventListener("click", () => {

            // 이전 촬영 사진 및 탐지 결과 제거
            sessionStorage.removeItem("cam1Pending");

            sessionStorage.setItem('canPlay', 'true');

            // 카메라 페이지로 복귀
            location.href = RETRY_PAGE;
        });

        // ==========================================
        // 6. PASS 버튼
        // ==========================================

        // [PASS] 버튼을 누를 때 >>패스 코드<<를 요구하는 모달 오픈
        passBtn.addEventListener("click", () => {
            openAuthModal('PASS');
        });

    </script>

</body>
</html>
