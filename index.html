
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 페이지</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 모바일 메인 화면 */
        .container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        /* 타이틀 */
        .title {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            color: #ffffff;
        }

        /* 타이틀 이미지 영역 */
        .image-box {
            width: 100%;
            height: 280px;
            background-color: #111111;
            border: 2px dashed #555555;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #aaaaaa;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 버튼 영역 */
        .button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 공통 버튼 */
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            background-color: #ffffff;
            color: #000000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 1. 타이틀 제목 -->
        <h1 class="title">타이틀 제목</h1>

        <!-- 2. 타이틀 이미지 -->
        <div class="image-box">

            <!-- 이미지 삽입 전 임시 문구 -->
            <p>타이틀 이미지 영역</p>

            <img src="title.png" alt="타이틀 이미지">


        </div>

        <!-- 3. 버튼 -->
        <div class="button-group">

            <!-- 시작 버튼 -->
            <button class="btn"
                    onclick="location.href='cam1.html'">
                시작하기
            </button>

            <!-- 끝내기 버튼 -->
            <button class="btn"
                    onclick="location.href='end.html'">
                끝내기
            </button>

        </div>

    </div>

</body>
</html>
