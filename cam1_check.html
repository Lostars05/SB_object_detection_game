
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>GAME CAM - 촬영 확인</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* 전체 화면 */
        .container {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            flex-direction: column;
            gap: 12px;

            padding:
                max(12px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));
        }

        /* 상단 점수 */
        #game-score {
            text-align: center;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: bold;
            padding: 8px 0;
            flex-shrink: 0;
        }

        /* 사진 영역 */
        .photo-area {
            flex: 1;
            min-height: 0;
            min-width: 0;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #photo-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 4 / 3;

            background: #111;
            border-radius: 14px;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 촬영한 사진 */
        #captured-photo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        #photo-message {
            color: #aaa;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        /* 하단 영역 */
        .bottom-area {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;

            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        /* 촬영 당시 퍼센트 박스 */
        #detection-panel {
            flex: 1;
            min-width: 0;
            min-height: 90px;
            max-height: 22dvh;

            overflow-y: auto;
            padding: 14px;

            background: #181818;
            border: 1px solid #444;
            border-radius: 12px;
        }

        #detection-panel h4 {
            font-size: clamp(12px, 3vw, 15px);
            margin-bottom: 10px;
        }

        .detection-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;

            margin-bottom: 7px;
            font-size: clamp(11px, 3vw, 14px);
        }

        .detection-item span:last-child {
            white-space: nowrap;
        }

        /* 확인 버튼 */
        #btn-confirm {
            width: clamp(76px, 21vw, 96px);
            height: clamp(64px, 18vw, 82px);

            flex-shrink: 0;
            border: none;
            border-radius: 12px;

            background: #fff;
            color: #000;

            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #btn-confirm:active {
            transform: scale(0.96);
        }

        #btn-confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 상태 표시 */
        #status {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            flex-shrink: 0;
        }

        /* 가로 화면 대응 */
        @media (orientation: landscape) {
            .container {
                gap: 6px;
            }

            #detection-panel {
                min-height: 55px;
                max-height: 20dvh;
                padding: 8px 12px;
            }

            #btn-confirm {
                width: 76px;
                height: 55px;
            }
        }

        /* --- 6번 화면용 모달 팝업 스타일 --- */
        #select-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none; /* 평소엔 숨김 */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            width: 100%;
            max-width: 400px;
            background: #181818;
            border: 2px solid #444;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }

        #modal-item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .selectable-item {
            padding: 14px;
            background: #222;
            border: 2px solid #555;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            transition: background 0.2s, border-color 0.2s;
        }

        .selectable-item.selected {
            background: #333333;
            border-color: #00ff88; /* 선택되면 초록빛 테두리 */
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #modal-pass {
            background: #444;
            color: #fff;
        }

        #modal-confirm {
            background: #fff;
            color: #000;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 1. 현재 점수 -->
        <h3 id="game-score">
            현재 점수: 0.00점
        </h3>

        <!-- 2. 촬영한 사진 -->
        <div class="photo-area" id="photo-area">

            <div id="photo-container">

                <img
                    id="captured-photo"
                    alt="촬영된 사진"
                >

                <p id="photo-message">
                    촬영 결과를 불러오는 중...
                </p>

            </div>

        </div>

        <!-- 3. 탐지 결과 및 확인 버튼 -->
        <div class="bottom-area">

            <!-- 촬영 당시 퍼센트 -->
            <div id="detection-panel">

                <h4>촬영 결과</h4>

                <div id="detection-list">
                    데이터를 불러오는 중...
                </div>

            </div>

            <!-- 확인 버튼 -->
            <button
                id="btn-confirm"
                type="button"
                disabled
            >
                확인
            </button>

        </div>

        <p id="status">
            촬영 결과 확인
        </p>

    </div>
<!-- 6번 화면: 물체 선택 모달 팝업 -->
    <div id="select-modal">
        <div class="modal-content">
            <div class="modal-title">점수에 반영할 것을 선택하세요</div>
            
            <div id="modal-item-list"></div>

            <div class="modal-buttons">
                <button id="modal-pass" class="modal-btn" type="button">Pass</button>
                <button id="modal-confirm" class="modal-btn" type="button">확인</button>
            </div>
        </div>
    </div>

    <script src="authority.js" defer></script>

    <script>
        // ==========================================
        // 1. 기본 설정
        // ==========================================

        // 추후 제작할 6번 페이지
        const NEXT_PAGE = "select.html";

        // 촬영 결과 데이터
        let captureData = null;

        const photo =
            document.getElementById("captured-photo");

        const photoMessage =
            document.getElementById("photo-message");

        const photoArea =
            document.getElementById("photo-area");

        const photoContainer =
            document.getElementById("photo-container");

        const detectionList =
            document.getElementById("detection-list");

        const confirmBtn =
            document.getElementById("btn-confirm");

        const statusText =
            document.getElementById("status");

        // ==========================================
        // 2. 페이지 실행
        // ==========================================


        window.addEventListener("DOMContentLoaded", () => {
        // 비정상 접근 차단
            if (!sessionStorage.getItem("cam1Pending")) {
                alert("잘못된 접근입니다.");
                location.replace("index.html");
                return;
            }

        // 뒤로가기 차단 및 현 화면 유지 보안 코드
        history.pushState(null, null, location.href);
            window.addEventListener('popstate', () => {
                history.pushState(null, null, location.href);
                alert("이전 페이지로 돌아갈 수 없습니다. 현재 단계를 진행해주세요.");
        });

        loadCaptureData();
    }
);

        // ==========================================
        // 3. 촬영 데이터 불러오기
        // ==========================================

        function loadCaptureData() {

            // cam1.html에서 임시 저장한 데이터
            const saved =
                sessionStorage.getItem("cam1Pending");

            if (!saved) {

                photoMessage.textContent =
                    "촬영된 사진이 없습니다.";

                detectionList.textContent =
                    "촬영 데이터 없음";

                statusText.textContent =
                    "먼저 카메라에서 사진을 촬영해주세요.";

                return;
            }

            try {

                captureData = JSON.parse(saved);

                if (
                    !captureData ||
                    !Array.isArray(captureData.detections) ||
                    !captureData.image
                ) {
                    throw new Error("촬영 데이터 형식 오류");
                }

                // 촬영 당시 사진 표시
                photo.onload = () => {

                    photo.style.display = "block";

                    photoMessage.style.display = "none";

                    resizePhoto();
                };

                photo.onerror = () => {

                    photo.style.display = "none";

                    photoMessage.textContent =
                        "사진을 불러올 수 없습니다.";

                    confirmBtn.disabled = true;
                };

                photo.src = captureData.image;

                // 촬영 당시 객체 및 퍼센트
                showDetections(captureData.detections);

                // 확인 버튼 활성화
                confirmBtn.disabled = false;

                statusText.textContent =
                    "촬영 결과가 고정되었습니다.";

            } catch (error) {

                console.error(
                    "촬영 데이터 불러오기 실패:",
                    error
                );

                photoMessage.textContent =
                    "사진을 불러올 수 없습니다.";

                detectionList.textContent =
                    "데이터 오류";

                confirmBtn.disabled = true;

                statusText.textContent =
                    "촬영 데이터를 확인해주세요.";
            }
        }

        // ==========================================
        // 4. 화면 크기 자동 조절
        // ==========================================

        function resizePhoto() {

            if (
                !photo.naturalWidth ||
                !photo.naturalHeight
            ) {
                return;
            }

            const ratio =
                photo.naturalWidth / photo.naturalHeight;

            const availableWidth =
                photoArea.clientWidth;

            const availableHeight =
                photoArea.clientHeight;

            if (
                !availableWidth ||
                !availableHeight
            ) {
                return;
            }

            const width = Math.min(
                availableWidth,
                availableHeight * ratio,
                900
            );

            const height = width / ratio;

            photoContainer.style.width =
                width + "px";

            photoContainer.style.height =
                height + "px";
        }

        const resizeObserver =
            new ResizeObserver(resizePhoto);

        resizeObserver.observe(photoArea);

        window.addEventListener(
            "resize",
            resizePhoto
        );

        // ==========================================
        // 5. 촬영 당시 퍼센트 표시
        // ==========================================

        function showDetections(detections) {

            detectionList.replaceChildren();

            if (detections.length === 0) {

                detectionList.textContent =
                    "탐지된 객체 없음";

                return;
            }

            // 화면 위쪽에 위치한 객체부터 정렬
            const sorted = [...detections].sort(
                (a, b) => (a.y ?? 0) - (b.y ?? 0)
            );

            sorted.forEach((det, index) => {

                const item =
                    document.createElement("div");

                item.className = "detection-item";

                const name =
                    document.createElement("span");

                name.textContent =
                    `${index + 1}. ${det.label}`;

                const percent =
                    document.createElement("span");

                const confidencePercent =
                    Number.isFinite(Number(det.percentage))
                        ? Number(det.percentage)
                        : Number(det.confidence) * 100;

                percent.textContent =
                    `${confidencePercent.toFixed(1)}%`;

                item.appendChild(name);
                item.appendChild(percent);

                detectionList.appendChild(item);
            });
        }

        // ==========================================
        // 6. 확인 버튼
        // ==========================================

        let selectedDetectionIndex = null;

        const selectModal = document.getElementById("select-modal");
        const modalItemList = document.getElementById("modal-item-list");
        const modalPassBtn = document.getElementById("modal-pass");
        const modalConfirmBtn = document.getElementById("modal-confirm");

        confirmBtn.addEventListener("click", () => {
            if (!captureData || !captureData.detections || captureData.detections.length === 0) {
                return;
            }

            // 모달 리스트 초기화 및 채우기
            modalItemList.replaceChildren();
            selectedDetectionIndex = null;

            captureData.detections.forEach((det, index) => {
                const div = document.createElement("div");
                div.className = "selectable-item";
                div.innerHTML = `<span>${index + 1}. ${det.label}</span><span>${det.percentage}%</span>`;

                // 클릭 시 선택 상태 변경 (어두워지는 효과)
                div.addEventListener("click", () => {
                    document.querySelectorAll('.selectable-item').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedDetectionIndex = index;
                });

                modalItemList.appendChild(div);
            });

            // 팝업 화면 띄우기
            selectModal.style.display = "flex";
        });

        // 팝업 안의 [Pass] 버튼
        modalPassBtn.addEventListener("click", () => {
            selectModal.style.display = "none";
            // >>패스 코드<< 승인 창 호출 (0점 추가 후 메인 이동)
            openAuthModal('PASS');
        });

        // 팝업 안의 [확인] 버튼 (최종 물체 선택 완료)
        modalConfirmBtn.addEventListener("click", () => {
            if (selectedDetectionIndex === null) {
                alert("점수에 반영할 물체를 선택해주세요!");
                return;
            }

            const chosenItem = captureData.detections[selectedDetectionIndex];

            const gameData = {
                capturedAt: captureData.capturedAt,
                selectedDetection: chosenItem
            };

            try {
                sessionStorage.setItem("gameCapture", JSON.stringify(gameData));
                sessionStorage.removeItem("cam1Pending");

                selectModal.style.display = "none";
                
                // >>점수 저장 코드<< 승인 창 호출 (선택된 객체 점수 누적 후 메인 이동)
                openAuthModal('SAVE_SCORE', chosenItem);

            } catch (error) {
                console.error("데이터 저장 실패:", error);
                statusText.textContent = "데이터 저장 실패";
            }
        });

    </script>

</body>
</html>
