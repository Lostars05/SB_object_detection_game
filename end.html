
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>GAME CAM - 최종 결과</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* 전체 화면 */
        .container {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding:
                max(24px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));
        }

        /* 중앙 결과 영역 */
        .result-area {
            width: 100%;
            max-width: 430px;

            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 25px;
        }

        /* 종료 제목 */
        .result-title {
            font-size: clamp(26px, 7vw, 36px);
            font-weight: bold;
            color: #fff;
        }

        /* 점수 표시 박스 */
        .score-box {
            width: 100%;
            padding: 40px 20px;

            background: #151515;
            border: 1px solid #444;
            border-radius: 16px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .score-label {
            font-size: clamp(16px, 4vw, 20px);
            color: #aaa;
        }

        /* 최종 누적 점수 */
        #final-score {
            font-size: clamp(42px, 12vw, 68px);
            font-weight: bold;
            color: #fff;
            overflow-wrap: anywhere;
        }

        .score-unit {
            font-size: clamp(18px, 4vw, 24px);
            color: #ccc;
        }

        /* 확인 버튼 */
        #btn-confirm {
            width: 100%;
            min-height: 60px;
            padding: 18px;

            background: #fff;
            color: #000;

            border: none;
            border-radius: 12px;

            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s;
        }

        #btn-confirm:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="result-area">

            <!-- 종료 제목 -->
            <h1 class="result-title">
                게임 종료
            </h1>

            <!-- 최종 점수 -->
            <div class="score-box">

                <p class="score-label">
                    최종 누적 점수
                </p>

                <div>
                    <span id="final-score">0.00</span>
                    <span class="score-unit">점</span>
                </div>

            </div>

            <!-- 확인 버튼 -->
            <button id="btn-confirm" type="button">
                확인
            </button>

        </div>

    </div>

    <script>
        // ==========================================
        // 1. 기본 설정
        // ==========================================

        // 확인 버튼 클릭 시 이동할 페이지
        const HOME_PAGE = "index.html";

        const finalScoreElement =
            document.getElementById("final-score");

        const confirmButton =
            document.getElementById("btn-confirm");

        // ==========================================
        // 2. 누적 점수 불러오기
        // ==========================================

        function getFinalScore() {

            // auth.js의 ScoreManager가 저장한 점수
            const savedScore =
                sessionStorage.getItem("gameTotalScore");

            const score = Number(savedScore);

            // 저장된 점수가 없거나 잘못된 경우
            if (!Number.isFinite(score)) {
                return 0;
            }

            return score;
        }

        // ==========================================
        // 3. 최종 점수 표시
        // ==========================================

        function displayFinalScore() {

            const totalScore = getFinalScore();

            finalScoreElement.textContent =
                totalScore.toFixed(2);
        }

        // 페이지 실행 시 점수 표시
        document.addEventListener(
            "DOMContentLoaded",
            displayFinalScore
        );

        // ==========================================
        // 4. 확인 버튼
        // ==========================================

        confirmButton.addEventListener("click", () => {

            // 기존 누적 점수 초기화
            sessionStorage.removeItem("gameTotalScore");

            // 이전 게임의 촬영 데이터 삭제
            sessionStorage.removeItem("gameCapture");
            sessionStorage.removeItem("cam1Pending");

            // 게임 진행 상태 초기화
            sessionStorage.removeItem("canPlay");

            // 처음 화면으로 이동
            location.href = HOME_PAGE;
        });

    </script>

</body>
</html>
