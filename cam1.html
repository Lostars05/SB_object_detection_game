
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   viewport-fit=cover">
    <title>GAME CAM</title>

    <!-- ONNX Runtime -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* 전체 화면 */
        .container {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding:
                max(12px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));
            gap: 12px;
        }

        /* 상단 점수 */
        #game-score {
            text-align: center;
            font-size: clamp(16px, 4.5vw, 23px);
            font-weight: bold;
            padding: 10px 0;
            flex-shrink: 0;
        }

        /* 카메라 영역 */
        .camera-area {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #webcam-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 4 / 3;
            max-height: 100%;
            background: #111;
            border-radius: 14px;
            overflow: hidden;
        }

        /* 카메라 영상 및 바운딩 박스 */
        #webcam,
        #canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        /* 하단 영역 */
        .bottom-area {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        /* 탐지 결과 박스 */
        #detection-panel {
            flex: 1;
            min-width: 0;
            min-height: 85px;
            max-height: min(22dvh, 180px);
            overflow-y: auto;
            background: #181818;
            border: 1px solid #444;
            border-radius: 12px;
            padding: clamp(10px, 3vw, 16px);
            font-size: clamp(11px, 3vw, 14px);
        }

        #detection-panel h4 {
            font-size: clamp(12px, 3.2vw, 15px);
            margin-bottom: 10px;
        }

        .detection-item {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .detection-item span:last-child {
            white-space: nowrap;
        }

        /* 원형 촬영 버튼 - 기능 미구현 */
        #btn-capture {
            width: clamp(58px, 17vw, 80px);
            height: clamp(58px, 17vw, 80px);
            flex-shrink: 0;
            border-radius: 50%;
            border: 5px solid #555;
            background: #fff;
            box-shadow: 0 0 0 3px #fff;
            cursor: pointer;
            margin: 4px;
            padding: 0;
        }

        #btn-capture:active {
            transform: scale(0.95);
        }

        /* 상태 표시 */
        #status {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            flex-shrink: 0;
        }

        /* 가로 화면 */
        @media (orientation: landscape) {
            .container {
                gap: 6px;
            }

            #game-score {
                padding: 0;
            }

            .bottom-area {
                gap: 12px;
            }

            #detection-panel {
                min-height: 55px;
                max-height: 18dvh;
                padding: 8px 12px;
            }

            #btn-capture {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 상단 점수 -->
        <h3 id="game-score">
            현재 점수: 0.00점
        </h3>

        <!-- 카메라 영역 -->
        <div class="camera-area">
            <div id="webcam-container">

                <video id="webcam"
                       autoplay
                       playsinline
                       muted></video>

                <canvas id="canvas"></canvas>

            </div>
        </div>

        <!-- 하단 탐지 결과 및 원형 버튼 -->
        <div class="bottom-area">

            <div id="detection-panel">
                <h4>실시간 탐지 결과</h4>
                <div id="detection-list">
                    모델 준비 중...
                </div>
            </div>

            <!-- 촬영 기능은 아직 구현하지 않음 -->
            <button id="btn-capture"
                    type="button"
                    aria-label="촬영 버튼 (미구현)">
            </button>

        </div>

        <p id="status">모델을 불러오는 중...</p>

    </div>

    <script>
        // ==========================================
        // 1. 기본 설정
        // ==========================================

        const MODEL_PATH = "best.onnx";

        // 학습한 클래스 이름
        const CLASS_NAMES = [];

        const CONF_THRESHOLD = 0.35;
        const IOU_THRESHOLD = 0.45;
        const MAX_DETECTIONS = 30;

        let session = null;
        let videoStream = null;
        let detecting = false;
        let latestDetections = [];

        const video = document.getElementById("webcam");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const cameraContainer =
            document.getElementById("webcam-container");

        const statusText = document.getElementById("status");
        const detectionList =
            document.getElementById("detection-list");

        const inputCanvas = document.createElement("canvas");

        const inputCtx = inputCanvas.getContext(
            "2d", { willReadFrequently: true }
        );

        let inputWidth = 640;
        let inputHeight = 640;

        // ==========================================
        // 2. 초기 실행
        // ==========================================

        window.addEventListener("DOMContentLoaded", async () => {
            await loadModel();
            await initWebcam();
        });

        // ==========================================
        // 3. 모델 로드
        // ==========================================

        async function loadModel() {
            try {
                statusText.textContent = "모델 로딩 중...";

                session = await ort.InferenceSession.create(
                    MODEL_PATH,
                    {
                        executionProviders: ["wasm"]
                    }
                );

                const inputName = session.inputNames[0];
                const metadata = session.inputMetadata[inputName];

                const dims =
                    metadata?.dimensions || metadata?.dims;

                if (dims && dims.length === 4) {
                    if (Number(dims[2]) > 0) {
                        inputHeight = Number(dims[2]);
                    }

                    if (Number(dims[3]) > 0) {
                        inputWidth = Number(dims[3]);
                    }
                }

                inputCanvas.width = inputWidth;
                inputCanvas.height = inputHeight;

                console.log("모델 입력:", session.inputNames);
                console.log("모델 출력:", session.outputNames);

                statusText.textContent = "모델 로드 완료";

            } catch (error) {
                console.error(error);

                statusText.textContent =
                    "모델 로드 실패: best.onnx 파일을 확인하세요.";

                detectionList.textContent = "모델 로드 실패";
            }
        }

        // ==========================================
        // 4. 웹캠 실행
        // ==========================================

        async function initWebcam() {
            try {
                videoStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            facingMode: "environment"
                        },
                        audio: false
                    });

                video.srcObject = videoStream;

                await video.play();

                // 실제 카메라 비율 적용
                const cameraWidth = video.videoWidth;
                const cameraHeight = video.videoHeight;

                cameraContainer.style.aspectRatio =
                    `${cameraWidth} / ${cameraHeight}`;

                canvas.width = cameraWidth;
                canvas.height = cameraHeight;

                requestAnimationFrame(renderFrame);

                if (session) {
                    startDetectionLoop();
                }

            } catch (error) {
                console.error(error);

                statusText.textContent = "웹캠 실행 실패";

                alert(
                    "웹캠 권한 및 HTTPS/localhost 접속을 확인하세요."
                );
            }
        }

        // ==========================================
        // 5. 이미지 -> ONNX Tensor
        // ==========================================

        function prepareInput() {
            const scale = Math.min(
                inputWidth / video.videoWidth,
                inputHeight / video.videoHeight
            );

            const drawWidth = video.videoWidth * scale;
            const drawHeight = video.videoHeight * scale;

            const padX = (inputWidth - drawWidth) / 2;
            const padY = (inputHeight - drawHeight) / 2;

            inputCtx.fillStyle = "rgb(114,114,114)";

            inputCtx.fillRect(
                0, 0,
                inputWidth,
                inputHeight
            );

            inputCtx.drawImage(
                video,
                padX,
                padY,
                drawWidth,
                drawHeight
            );

            const imageData = inputCtx.getImageData(
                0, 0,
                inputWidth,
                inputHeight
            );

            const pixels = imageData.data;
            const area = inputWidth * inputHeight;

            const floatData = new Float32Array(area * 3);

            for (let i = 0; i < area; i++) {
                floatData[i] = pixels[i * 4] / 255;
                floatData[area + i] =
                    pixels[i * 4 + 1] / 255;
                floatData[area * 2 + i] =
                    pixels[i * 4 + 2] / 255;
            }

            return {
                tensor: new ort.Tensor(
                    "float32",
                    floatData,
                    [1, 3, inputHeight, inputWidth]
                ),
                scale,
                padX,
                padY
            };
        }

        // ==========================================
        // 6. 실시간 추론
        // ==========================================

        async function startDetectionLoop() {
            if (detecting) return;

            detecting = true;

            while (
                session &&
                videoStream &&
                video.readyState >= 2
            ) {
                try {
                    const {
                        tensor,
                        scale,
                        padX,
                        padY
                    } = prepareInput();

                    const feeds = {};

                    feeds[session.inputNames[0]] = tensor;

                    const results = await session.run(feeds);

                    const output =
                        results[session.outputNames[0]];

                    let detections = processOutput(
                        output,
                        scale,
                        padX,
                        padY
                    );

                    detections = applyNMS(detections);

                    latestDetections = detections;

                    updateDetectionPanel(detections);

                    statusText.textContent =
                        `실시간 탐지 중 | 객체 ${detections.length}개`;

                } catch (error) {
                    console.error(error);

                    statusText.textContent =
                        "추론 오류: 모델 출력 형식을 확인하세요.";

                    latestDetections = [];
                    detectionList.textContent = "추론 오류";
                    break;
                }

                await new Promise(resolve =>
                    requestAnimationFrame(resolve)
                );
            }

            detecting = false;
        }

        // ==========================================
        // 7. ONNX 출력 해석
        // ==========================================

        function processOutput(output, scale, padX, padY) {
            const data = output.data;
            const dims = output.dims;

            const detections = [];

            if (dims.length !== 3 && dims.length !== 2) {
                throw new Error(
                    "지원하지 않는 출력 차원: " +
                    dims.join(",")
                );
            }

            const rows =
                dims.length === 3 ? dims[1] : dims[0];

            const cols =
                dims.length === 3 ? dims[2] : dims[1];

            let transposed = false;
            let count;
            let attributes;

            if (rows < cols && rows >= 5) {
                transposed = true;
                count = cols;
                attributes = rows;
            } else {
                count = rows;
                attributes = cols;
            }

            if (attributes < 5) {
                throw new Error("출력 항목 수 부족");
            }

            function value(i, j) {
                return transposed
                    ? data[j * count + i]
                    : data[i * attributes + j];
            }

            const isNMSOutput =
                attributes === 6 &&
                count <= 1000;

            for (let i = 0; i < count; i++) {
                let x1, y1, x2, y2;
                let confidence;
                let classId;

                if (isNMSOutput) {
                    x1 = value(i, 0);
                    y1 = value(i, 1);
                    x2 = value(i, 2);
                    y2 = value(i, 3);

                    confidence = value(i, 4);
                    classId = Math.round(value(i, 5));

                } else {
                    const cx = value(i, 0);
                    const cy = value(i, 1);
                    const w = value(i, 2);
                    const h = value(i, 3);

                    confidence = 0;
                    classId = 0;

                    const hasObjectness =
                        CLASS_NAMES.length > 0 &&
                        attributes === CLASS_NAMES.length + 5;

                    const classStart =
                        hasObjectness ? 5 : 4;

                    const objectness =
                        hasObjectness ? value(i, 4) : 1;

                    for (
                        let c = classStart;
                        c < attributes;
                        c++
                    ) {
                        const score =
                            objectness * value(i, c);

                        if (score > confidence) {
                            confidence = score;
                            classId = c - classStart;
                        }
                    }

                    x1 = cx - w / 2;
                    y1 = cy - h / 2;
                    x2 = cx + w / 2;
                    y2 = cy + h / 2;
                }

                if (
                    !Number.isFinite(confidence) ||
                    confidence < CONF_THRESHOLD
                ) {
                    continue;
                }

                x1 = (x1 - padX) / scale;
                y1 = (y1 - padY) / scale;
                x2 = (x2 - padX) / scale;
                y2 = (y2 - padY) / scale;

                x1 = Math.max(
                    0, Math.min(canvas.width, x1)
                );

                y1 = Math.max(
                    0, Math.min(canvas.height, y1)
                );

                x2 = Math.max(
                    0, Math.min(canvas.width, x2)
                );

                y2 = Math.max(
                    0, Math.min(canvas.height, y2)
                );

                if (x2 <= x1 || y2 <= y1) continue;

                detections.push({
                    x: x1,
                    y: y1,
                    width: x2 - x1,
                    height: y2 - y1,
                    confidence,
                    classId,
                    label:
                        CLASS_NAMES[classId] ||
                        `Class ${classId}`
                });
            }

            return detections;
        }

        // ==========================================
        // 8. 중복 박스 제거 (NMS)
        // ==========================================

        function calculateIoU(a, b) {
            const x1 = Math.max(a.x, b.x);
            const y1 = Math.max(a.y, b.y);

            const x2 = Math.min(
                a.x + a.width,
                b.x + b.width
            );

            const y2 = Math.min(
                a.y + a.height,
                b.y + b.height
            );

            const w = Math.max(0, x2 - x1);
            const h = Math.max(0, y2 - y1);

            const intersection = w * h;

            const union =
                a.width * a.height +
                b.width * b.height -
                intersection;

            return union > 0
                ? intersection / union
                : 0;
        }

        function applyNMS(detections) {
            detections.sort(
                (a, b) =>
                    b.confidence - a.confidence
            );

            const selected = [];

            for (const detection of detections) {
                const overlaps = selected.some(
                    existing =>
                        existing.classId ===
                            detection.classId &&
                        calculateIoU(
                            existing,
                            detection
                        ) > IOU_THRESHOLD
                );

                if (!overlaps) {
                    selected.push(detection);
                }

                if (
                    selected.length >= MAX_DETECTIONS
                ) {
                    break;
                }
            }

            // 카메라 화면 위쪽부터 정렬
            selected.sort(
                (a, b) => a.y - b.y
            );

            return selected;
        }

        // ==========================================
        // 9. 바운딩 박스 그리기
        // ==========================================

        function renderFrame() {
            if (video.readyState >= 2) {
                ctx.clearRect(
                    0, 0,
                    canvas.width,
                    canvas.height
                );

                for (const detection of latestDetections) {
                    drawBoundingBox(detection);
                }
            }

            requestAnimationFrame(renderFrame);
        }

        function drawBoundingBox(det) {
            const color = "#00ff88";

            ctx.strokeStyle = color;
            ctx.lineWidth = 3;

            ctx.strokeRect(
                det.x,
                det.y,
                det.width,
                det.height
            );

            const text =
                `${det.label} ${(det.confidence * 100).toFixed(1)}%`;

            ctx.font = "bold 16px Arial";

            const textWidth =
                ctx.measureText(text).width;

            const labelWidth = textWidth + 12;
            const labelHeight = 25;

            const labelY = Math.max(
                0, det.y - labelHeight
            );

            ctx.fillStyle = color;

            ctx.fillRect(
                det.x,
                labelY,
                labelWidth,
                labelHeight
            );

            ctx.fillStyle = "#000";

            ctx.fillText(
                text,
                det.x + 6,
                labelY + 18
            );
        }

        // ==========================================
        // 10. 실시간 신뢰도 표시
        // ==========================================

        function updateDetectionPanel(detections) {
            detectionList.replaceChildren();

            if (detections.length === 0) {
                detectionList.textContent =
                    "탐지된 객체 없음";
                return;
            }

            detections.forEach((det, index) => {
                const item =
                    document.createElement("div");

                item.className = "detection-item";

                const name =
                    document.createElement("span");

                name.textContent =
                    `${index + 1}. ${det.label}`;

                const percent =
                    document.createElement("span");

                percent.textContent =
                    `${(det.confidence * 100).toFixed(1)}%`;

                item.appendChild(name);
                item.appendChild(percent);

                detectionList.appendChild(item);
            });
        }

        // ==========================================
        // 11. 촬영 기능
        // 현재 구현하지 않음
        // ==========================================

        // 원형 버튼은 디자인만 표시합니다.
        // 촬영 및 사진 저장 동작은 없습니다.

        // ==========================================
        // 12. 카메라 종료 처리
        // ==========================================

        window.addEventListener("pagehide", () => {
            if (videoStream) {
                videoStream.getTracks().forEach(
                    track => track.stop()
                );
            }
        });

    </script>

</body>
</html>
